appId: com.midlunch.Flashcardapp
---
- launchApp:
    clearState: false
- openLink: flashcardapp://maestro-seed
- assertVisible: "Maestro test data ready"
- tapOn:
    id: "maestro-open-browse-decks"
- assertVisible:
    id: "browse-decks-screen"
- tapOn:
    id: "browse-decks-search-input"
- inputText: "AI"
- tapOn:
    id: "browse-deck-open-maestro-deck-ai-systems"
- assertVisible:
    id: "browse-session-screen"
- assertVisible: "What does RAG add to an AI assistant?"
- tapOn:
    id: "browse-session-flip-card-image"
- assertVisible: "Retrieval-augmented generation lets the assistant pull relevant external context before answering."
- tapOn:
    id: "browse-session-next-card-image"
- assertVisible: "What is an embedding?"
